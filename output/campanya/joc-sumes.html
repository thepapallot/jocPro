<style>@font-face {
    font-family: 'Orbitron';
    src: url('../legacy-assets/Orbitron-Regular.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
}

@font-face {
    font-family: 'Orbitron';
    src: url('../legacy-assets/Orbitron-Medium.ttf') format('truetype');
    font-weight: 500;
    font-style: normal;
}

@font-face {
    font-family: 'Orbitron';
    src: url('../legacy-assets/Orbitron-SemiBold.ttf') format('truetype');
    font-weight: 600;
    font-style: normal;
}

@font-face {
    font-family: 'Orbitron';
    src: url('../legacy-assets/Orbitron-Bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
}

@font-face {
    font-family: 'Orbitron';
    src: url('../legacy-assets/Orbitron-ExtraBold.ttf') format('truetype');
    font-weight: 800;
    font-style: normal;
}

@font-face {
    font-family: 'Orbitron';
    src: url('../legacy-assets/Orbitron-Black.ttf') format('truetype');
    font-weight: 900;
    font-style: normal;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg-dark: #010203;
    --bg-deep: #02050b;
    --cyan: #45e6ff;
    --pink: #ff59d6;
    --text: #eafcff;
    --warning: #ffb347;
    --bad: #ff4f6d;
}

html,
body {
    height: 100%;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
    color: var(--text);
    font-family: 'Orbitron', sans-serif;
    background:
        radial-gradient(circle at 50% 42%, rgba(0,240,255,0.10), transparent 28%),
        radial-gradient(circle at 30% 30%, rgba(0,240,255,0.06), transparent 24%),
        radial-gradient(circle at 70% 72%, rgba(255,89,214,0.08), transparent 28%),
        linear-gradient(180deg, var(--bg-dark) 0%, var(--bg-deep) 45%, #02040a 100%);
}

#game-stage {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1920px;
    height: 1080px;
    min-height: 0;
    overflow: hidden;
    transform-origin: center center;
}

#game-frame {
    position: absolute;
    inset: 18px;
    z-index: 1;
    pointer-events: none;
    border: 1px solid rgba(69, 230, 255, 0.18);
    border-radius: 24px;
    box-shadow:
        0 0 24px rgba(0, 240, 255, 0.06),
        inset 0 0 24px rgba(0, 240, 255, 0.03);
}

#game-frame::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(255, 89, 214, 0.08);
    border-radius: 18px;
}

#top-area {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 24px;
    padding: 24px 44px 0;
}

#top-area::after {
    content: "";
    position: absolute;
    bottom: -2px;
    left: 50%;
    transform: translateX(-50%);
    width: min(760px, 70%);
    height: 2px;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,89,214,0.45),
        rgba(0,240,255,0.95),
        rgba(255,89,214,0.45),
        transparent
    );
}

.top-cell {
    position: relative;
    z-index: 2;
    align-self: center;
}

#top-center {
    display: flex;
    justify-content: center;
    align-items: center;
}

.level-title {
    font-size: clamp(2.2rem, 4vw, 4.2rem);
    font-weight: 800;
    letter-spacing: 0.08em;
    line-height: 1;
    text-transform: uppercase;
    color: var(--cyan);
    text-shadow:
        0 0 12px rgba(0,240,255,0.75),
        0 0 24px rgba(0,240,255,0.22);
}

#top-video {
    width: 140px;
    height: 140px;
    object-fit: contain;
    filter:
        drop-shadow(0 0 18px rgba(0,240,255,0.75))
        drop-shadow(0 0 34px rgba(255,89,214,0.18));
}

#top-right {
    display: flex;
    justify-content: flex-end;
    align-items: center;
}

#timer {
    font-size: clamp(2.2rem, 4vw, 4.4rem);
    font-weight: 800;
    line-height: 1;
    text-align: right;
    color: var(--text);
}

#timer.warning {
    color: var(--warning);
    text-shadow:
        0 0 12px rgba(255,179,71,0.55),
        0 0 28px rgba(255,179,71,0.20);
}

#timer.expired {
    color: var(--bad);
    text-shadow:
        0 0 12px rgba(255,79,109,0.55),
        0 0 28px rgba(255,79,109,0.20);
}

#bottom-area {
    position: relative;
    z-index: 1;
    height: calc(100% - 170px);
}

@media (max-width: 900px) {
    #top-area {
        grid-template-columns: 1fr auto 1fr;
        gap: 16px;
        padding: 22px 24px 0;
    }

    #top-video {
        width: 104px;
        height: 104px;
    }
}

@media (max-width: 640px) {
    #game-frame {
        inset: 10px;
        border-radius: 18px;
    }

    #game-frame::before {
        inset: 7px;
        border-radius: 12px;
    }

    #top-area {
        gap: 12px;
        padding: 18px 18px 0;
    }

    #top-video {
        width: 84px;
        height: 84px;
    }

    .level-title,
    #timer {
        font-size: clamp(1.5rem, 7vw, 2.2rem);
    }

    #bottom-area {
        height: calc(100% - 124px);
    }
}
</style>
<style>/* Solved banner styles (matching puzzle8 green) */
.p1-phase-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translateX(-50%) translateY(-50%) scale(0.95);
    z-index: 950;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vh, 20px);
    width: min(96vw, 920px);
    aspect-ratio: 1 / 1;
    max-height: 94vh;
    padding: clamp(16px, 3.2vw, 48px);
    box-sizing: border-box;
    text-align: center;
    border-radius: 8px;
    border: 2px solid rgba(69, 230, 255, 0.32);
    background:
        radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.05), transparent 56%),
        radial-gradient(circle at 50% 50%, rgba(69, 230, 255, 0.08), rgb(10, 18, 32) 68%),
        linear-gradient(180deg, rgb(8, 18, 33) 0%, rgb(5, 12, 24) 100%);
    box-shadow:
        0 0 0 100vmax rgba(45,255,155,0.16),
        0 0 34px rgba(0, 240, 255, 0.14),
        inset 0 0 54px rgba(69, 230, 255, 0.08);
    opacity: 0;
    overflow: hidden;
    transition: opacity 200ms ease, transform 200ms ease;
}

.p1-phase-popup.is-visible {
    opacity: 1;
    transform: translateX(-50%) translateY(-50%) scale(1);
}

.p1-phase-popup-line {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding-inline: 0;
    box-sizing: border-box;
    color: #ffffff;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.98rem, 5.45vw, 5.25rem);
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55);
    line-height: 1.05;
    text-align: center;
    white-space: nowrap;
    padding-inline: clamp(6px, 1vw, 12px);
    max-width: 96%;
    overflow: visible;
}

.p1-solved-banner {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(45,255,155,0.88);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    opacity: 1;
    transition: opacity 0.4s;
    border: 1px solid rgba(45,255,155,0.4);
    border-radius: 24px;
    box-shadow: 0 0 60px rgba(45,255,155,0.2);
    text-shadow: 0 0 24px rgba(45,255,155,0.6);
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-align: center;
    padding: 40px;
    animation: p1FadeIn 0.5s ease;
}
.p1-solved-banner.hidden {
    display: none !important;
}
.p1-solved-text {
    color: #fff;
    font-size: clamp(3rem, 5.2vw, 5.4rem);
    line-height: 1.05;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    text-shadow: 0 2px 24px #1a7f4f, 0 0 32px #2dff9b, 0 0 8px #000;
    letter-spacing: 0.04em;
}
@keyframes p1FadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
}
@keyframes p1SolvedFlash {
    0%   { background: rgba(45,255,155,0); }
    20%  { background: rgba(45,255,155,0.38); }
    100% { background: rgba(45,255,155,0.12); }
}
body.p1-solved-flash {
    animation: p1SolvedFlash 2.2s ease-out forwards;
}
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    z-index: 1;
    background:
        radial-gradient(circle at 50% 30%, rgba(255, 86, 118, 0.18) 0%, rgba(255, 86, 118, 0.08) 28%, rgba(255, 86, 118, 0) 58%),
        linear-gradient(180deg, rgba(120, 0, 18, 0.14) 0%, rgba(180, 18, 42, 0.1) 45%, rgba(90, 0, 0, 0.16) 100%);
    transition: opacity 0.28s ease;
}
body.p1-danger-state::before {
    opacity: 1;
    animation: p1DangerPulse 1.8s ease-in-out infinite;
}
@keyframes p1DangerPulse {
    0%, 100% {
        filter: saturate(1);
        opacity: 0.88;
    }
    50% {
        filter: saturate(1.15);
        opacity: 1;
    }
}
:root {
    --cyan: #45e6ff;
    --cyan-strong: #00f0ff;
    --pink: #ff59d6;
    --white: #eafcff;
    --ok: #2dff9b;
    --bad: #ff4f6d;
    --warning: #ffb347;
}

/* =========================
   GAME AREA
========================= */

#bottom-area {
    position: relative;
    z-index: 1;
    height: calc(100% - 170px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 24px;
    gap: 18px;
}

/* =========================
   PANEL CENTRAL
========================= */

#objective-panel {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: min(92vw, 1120px);
    box-sizing: border-box;
    gap: 12px;
    padding: 20px 40px;
    border-radius: 24px;
    background: #07101f;
    border: 1px solid rgba(69,230,255,0.25);
    box-shadow:
        0 0 24px rgba(0,240,255,0.12),
        inset 0 0 18px rgba(0,240,255,0.04);
    animation: floatPanel 6s ease-in-out infinite;
}

@keyframes floatPanel {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
}

/* FASE */

#round-indicator {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 0;
    padding: 12px 18px;
    border-radius: 999px;
    border: 1px solid rgba(69,230,255,0.30);
    background: rgba(5,12,24,0.95);
    box-shadow:
        0 0 14px rgba(0,240,255,0.12),
        inset 0 0 10px rgba(0,240,255,0.04);
}

.phase-step {
    position: relative;
    width: 16px;
    height: 16px;
    border-radius: 999px;
    border: 1px solid rgba(69,230,255,0.34);
    background: rgba(69,230,255,0.08);
    box-shadow: inset 0 0 10px rgba(0,240,255,0.03);
    transition:
        transform 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
}

.phase-step::after {
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 999px;
    background: rgba(69,230,255,0.16);
}

.phase-step.is-complete {
    border-color: rgba(45,255,155,0.58);
    background: rgba(45,255,155,0.18);
    box-shadow:
        0 0 14px rgba(45,255,155,0.2),
        inset 0 0 12px rgba(45,255,155,0.08);
}

.phase-step.is-complete::after {
    background: var(--ok);
}

.phase-step.is-active {
    transform: scale(1.18);
    border-color: rgba(69,230,255,0.72);
    background: rgba(69,230,255,0.2);
    box-shadow:
        0 0 16px rgba(0,240,255,0.24),
        0 0 28px rgba(255,89,214,0.08),
        inset 0 0 12px rgba(0,240,255,0.08);
}

.phase-step.is-active::after {
    background: var(--cyan);
}

.phase-link {
    width: 40px;
    height: 2px;
    border-radius: 999px;
    background: linear-gradient(
        90deg,
        rgba(69,230,255,0.16),
        rgba(69,230,255,0.4)
    );
    opacity: 0.7;
    transition: background 0.25s ease, opacity 0.25s ease;
}

.phase-link.is-complete {
    background: linear-gradient(
        90deg,
        rgba(45,255,155,0.42),
        rgba(45,255,155,0.8)
    );
    opacity: 1;
}

/* FORMULA */

#objective-formula {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    gap: 28px;
    margin-top: 0;
}

.formula-item {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 146px;
    height: 146px;
    flex: 0 0 146px;
}

#objective-formula img {
    position: absolute;
    inset: 0;
    width: 146px;
    height: 146px;
    object-fit: contain;
    filter:
        drop-shadow(0 0 14px rgba(0,240,255,0.24))
        drop-shadow(0 0 24px rgba(255,89,214,0.10));
}

/* Augmentem el màxim per projector */
#objective-formula span {
    font-size: clamp(2.2rem, 6vw, 7rem);
    font-weight: 800;
    line-height: 1;
    color: #d8f3ff;
    text-shadow:
        0 0 10px rgba(180,235,255,0.18),
        0 0 18px rgba(0,240,255,0.08);
}

.formula-value,
.formula-result-value {
    display: none;
    font-size: clamp(3rem, 5vw, 4.6rem);
    font-weight: 800;
    line-height: 1;
    color: #d8f3ff;
    text-shadow:
        0 0 10px rgba(180,235,255,0.18),
        0 0 18px rgba(0,240,255,0.08);
}

.formula-value {
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    font-size: clamp(4.2rem, 7vw, 5.8rem);
    z-index: 2;
}

.formula-result-value {
    min-width: 110px;
    text-align: center;
    font-size: clamp(4rem, 6.2vw, 5.6rem);
}

#objective-formula.show-values .formula-value,
#objective-formula.show-values .formula-result-value {
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

#objective-formula.result-only #formula-left,
#objective-formula.result-only #formula-right,
#objective-formula.result-only span:not(.formula-result-value) {
    display: none;
}

#objective-formula.result-only {
    gap: 0;
}

#objective-formula.result-only .formula-result-value {
    font-size: clamp(4rem, 7vw, 6rem);
}

#objective-formula.show-values img {
    display: none;
}

#objective-formula.success .formula-value,
#objective-formula.success .formula-result-value {
    color: var(--ok);
    text-shadow:
        0 0 10px rgba(45,255,155,0.24),
        0 0 18px rgba(45,255,155,0.1);
}

#objective-formula.error .formula-value,
#objective-formula.error .formula-result-value {
    color: var(--bad);
    text-shadow:
        0 0 10px rgba(255,79,109,0.22),
        0 0 18px rgba(255,79,109,0.1);
}

#objective-message {
    width: min(94%, 1200px);
    min-height: 1.4em;
    text-align: center;
    font-size: clamp(2.2rem, 4vw, 3.8rem);
    font-weight: 700;
    line-height: 1.3;
    color: rgba(216,243,255,0.95);
    text-shadow: 0 0 10px rgba(180,235,255,0.14);
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.2s ease, transform 0.2s ease;
}

#objective-message.is-visible {
    opacity: 1;
    transform: translateY(0);
}

#objective-message.is-error {
    color: var(--bad);
    text-shadow:
        0 0 10px rgba(255,79,109,0.24),
        0 0 18px rgba(255,79,109,0.1);
}

#objective-panel.p1-formula-error {
    border-color: rgba(255,79,109,0.72);
    background:
        radial-gradient(circle at 50% 26%, rgba(255, 84, 115, 0.34) 0%, rgba(255, 84, 115, 0.16) 32%, rgba(7,16,31,0.88) 70%),
        linear-gradient(180deg, rgba(255, 44, 86, 0.2) 0%, rgba(255, 44, 86, 0.07) 46%, rgba(7,16,31,0.9) 100%);
    box-shadow:
        0 0 28px rgba(255,79,109,0.38),
        0 0 44px rgba(255,79,109,0.18),
        inset 0 0 18px rgba(255,79,109,0.18);
}

/* =========================
   FEEDBACK
========================= */

#solved-container {
    position: relative;
    z-index: 2;
    min-height: 56px;
    margin-top: 6px;
}

.status-badge {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    margin: 0 auto;
    border-radius: 999px;
    border: 1px solid rgba(69,230,255,0.24);
    background: rgba(5,12,24,0.88);
    box-shadow:
        0 0 18px rgba(0,240,255,0.08),
        inset 0 0 14px rgba(0,240,255,0.03);
}

.status-badge::before,
.status-badge::after {
    content: "";
    position: absolute;
}

.status-badge.is-success {
    border-color: rgba(45,255,155,0.38);
    box-shadow:
        0 0 18px rgba(45,255,155,0.18),
        inset 0 0 14px rgba(45,255,155,0.05);
}

.status-badge.is-success::before {
    width: 10px;
    height: 20px;
    border-right: 4px solid var(--ok);
    border-bottom: 4px solid var(--ok);
    transform: rotate(45deg) translate(-1px, -2px);
}

.status-badge.is-error {
    border-color: rgba(255,79,109,0.38);
    box-shadow:
        0 0 18px rgba(255,79,109,0.16),
        inset 0 0 14px rgba(255,79,109,0.05);
}

.status-badge.is-error::before,
.status-badge.is-error::after {
    width: 24px;
    height: 3px;
    border-radius: 999px;
    background: var(--bad);
}

.status-badge.is-error::before {
    transform: rotate(45deg);
}

.status-badge.is-error::after {
    transform: rotate(-45deg);
}

.status-badge.is-reset {
    border-color: rgba(255,179,71,0.42);
    box-shadow:
        0 0 18px rgba(255,179,71,0.18),
        inset 0 0 14px rgba(255,179,71,0.06);
}

.status-badge.is-reset::before {
    inset: 10px;
    border-radius: 999px;
    border: 3px solid transparent;
    border-top-color: var(--warning);
    border-right-color: var(--warning);
    animation: statusSpin 1s linear infinite;
}

.status-badge.is-timeout {
    border-color: rgba(255,79,109,0.38);
    box-shadow:
        0 0 18px rgba(255,79,109,0.16),
        inset 0 0 14px rgba(255,79,109,0.05);
}

.status-badge.is-timeout::before {
    width: 24px;
    height: 28px;
    border: 3.5px solid var(--bad);
    border-top-width: 4px;
    border-bottom-width: 4px;
    border-radius: 999px;
}

.status-badge.is-timeout::after {
    width: 10px;
    height: 10px;
    border-radius: 999px;
    background: var(--bad);
    box-shadow: 0 12px 0 0 rgba(255,79,109,0.35);
}

.status-badge.is-countdown {
    border-color: rgba(255,179,71,0.46);
    box-shadow:
        0 0 18px rgba(255,179,71,0.2),
        inset 0 0 14px rgba(255,179,71,0.06);
}

.status-badge.is-countdown::before {
    inset: 6px;
    border-radius: 999px;
    border: 2px solid rgba(255,179,71,0.24);
}

.status-badge-value {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 1.25ch;
    text-align: center;
    font-size: 1.2rem;
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    color: var(--warning);
    text-shadow:
        0 0 10px rgba(255,179,71,0.3),
        0 0 20px rgba(255,179,71,0.1);
}

@keyframes statusSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* =========================
   GRID
========================= */

#puzzle-container {
    position: relative;
    z-index: 2;
    display: grid;
    flex: 1 1 auto;
    min-height: 0;
    align-content: center;
    justify-content: center;
    width: min(1280px, calc(100vw - 48px));
    max-width: 100%;
    padding: 0 24px 18px;
    box-sizing: border-box;
    margin-top: 0;
}

#puzzle-container.round-1 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: clamp(16px, 2vw, 28px);

function resize(){document.getElementById('game-stage').style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/1920,innerHeight/1080)+')';}
function skin(){const proposed=location.hash!=='#original';document.body.classList.toggle('proposed',proposed);for(const [key,value] of Object.entries({cyan:palette.cyan,pink:palette.pink,ok:palette.progress})){if(proposed)document.body.style.setProperty('--'+key,value);else document.body.style.removeProperty('--'+key);}document.getElementById('formula-left-image').src=proposed?'../logo/piramide-recreada.svg':'../legacy-assets/piramidetrans.png';}
addEventListener('resize',resize);addEventListener('hashchange',skin);resize();skin();
</script></body>
