ing:-.07em;padding-right:.07em}.pulse-track{display:flex;gap:14px;margin-top:12px}.pulse-track i{width:100px;height:8px;background:#31445c}.pulse-track i.active{background:var(--ice)}.game-preview{position:absolute;inset:0;width:1920px;height:1080px;border:0;background:#02050b}.fs-tip{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 18px;background:#101827ec;border:1px solid #40526a;border-radius:8px;color:#e8f0fa;font-size:14px;z-index:4;pointer-events:none}.viewport:not(:fullscreen) .fs-tip{display:none}.stage[data-finish=quiet]{background:#070c16}.stage[data-finish=quiet]:before{display:none}.stage[data-finish=quiet] .result-ring{box-shadow:none;background:#0b1422}.hidden,[hidden]{display:none!important}@media(max-width:700px){.review{gap:8px;padding:10px}.review-brand{width:100%}.review .full{margin-left:0}.review nav button{padding:9px;font-size:12px}.tools{padding:10px;font-size:12px}.tools .actions{width:100%}}

<body>
<header class="review">
 <span class="review-brand">PIRÀMIDE <small>/ CAMPANYA · V4</small></span>
 <nav aria-label="Pantalles de la proposta"><button data-screen="welcome">Benvinguda</button><button data-screen="brief" aria-pressed="true">Suport GM</button><button data-screen="ready">Preparats</button><button data-screen="success">Superat</button><button data-screen="progress">Progrés</button><button data-screen="final">Final</button><button data-screen="game">Joc existent · Sumes</button></nav>
 <label id="puzzle-label">Puzle <select id="puzzle"><option value="sumas">Sumes</option><option value="memory">Memory</option><option value="segments">Segments</option></select></label>
 <label>Acabat <select id="theme"><option value="campanya">El repte és de tots · NOVA</option><option value="escenari">Escenari · sobri</option><option value="confluencia">Confluència · càlid</option><option value="pols">Pols · cian i magenta</option></select></label>
 <button class="full" id="fullscreen">Pantalla completa ↗</button>
</header>
<main id="viewport" class="viewport" aria-label="Previsualització de la pantalla de sala"><div id="stage" class="stage"></div><div class="fs-tip" id="fs-tip" hidden>← → Canviar pantalla · Espai: exemple · Esc: sortir</div></main>
<footer class="tools"><span id="description">Suport visual de sala · exemple provisional · cap locució.</span><div class="actions"><label id="progress-controls" hidden>Progrés de mostra <input id="progress-input" type="range" min="0" max="100" step="5" value="30"><output id="progress-value">30%</output><button id="advance">+10%</button></label><button id="demo">Mostrar resultat</button><button id="finish" aria-pressed="false">Fons més net</button><span id="game-tools" hidden><button data-skin="original" aria-pressed="false">Estil actual</button> <button data-skin="proposed" aria-pressed="true">Proposta de colors</button></span><span><kbd>←</kbd> <kbd>→</kbd> Pantalles · <kbd>Espai</kbd> Exemple</span></div></footer>
<script src="logo/piramide-component.js"></script>
<script>
(()=>{
 const viewport=document.getElementById('viewport'),stage=document.getElementById('stage'),picker=document.getElementById('puzzle'),description=document.getElementById('description'),demoButton=document.getElementById('demo');
 const order=['welcome','brief','ready','success','progress','final','game'];
 let current='welcome',puzzle='sumas',reveal=false,clean=false,skin='proposed',count=3,countTimer=null,tipTimer=null,progress=30,theme='campanya';
 const titles={sumas:'Càlcul extrem',memory:'Memòria fantasma',segments:'Patró mestre'};
 const token='../static/images/shared/gameplay/token_card.png',terminal='../static/images/shared/gameplay/terminal_box.png';
 const themes={campanya:{cyan:'#39d6e5',pink:'#dc68a7',progress:'#edb970'},escenari:{cyan:'#8dcbd1',pink:'#b18aa7',progress:'#7ac9b6'},confluencia:{cyan:'#8dcbd1',pink:'#d5b781',progress:'#d5b781'},pols:{cyan:'#82d4e0',pink:'#c58bae',progress:'#82cdd7'}};
 function shownProgress(){return current==='welcome'?0:current==='final'?100:progress;}
 function logo(className='',amount=shownProgress(),previous){const colors=themes[theme];let result=PyramidLogo.markup({className,progress:amount,previous,cyan:colors.cyan,pink:colors.pink,'progress-color':colors.progress,bloom:theme==='campanya'?.28:.16});if(theme==='campanya'&&current==='welcome'&&className==='hero-pyramid'){const holder=document.createElement('div');holder.innerHTML=result;PyramidLogo.paint(holder,'brick-08-02','#dc68a7');PyramidLogo.paint(holder,'brick-06-02','#39d6e5');PyramidLogo.paint(holder,'brick-10-04','#39d6e5');result=holder.innerHTML;}return result;}
 function progressText(amount){return `<div class="progress-value">${amount}%<small>progrés col·lectiu</small></div><div class="progress-bar"><i style="width:${amount}%"></i></div>`;}
 function header(label){return `<header class="screen-head"><div class="overline">${label}</div><div class="brand">${logo()}<span>LA PIRÀMIDE</span></div></header>`;}
 function footer(main,small=''){return `<footer class="screen-footer"><span class="key">${main}</span>${small?`<span class="quiet">${small}</span>`:'<span class="step-line"><span class="active"></span><span class="'+(reveal?'active':'')+'"></span></span>'}</footer>`;}
 function leds(){return '<div class="leds" role="img" aria-label="Segments verd, violeta i vermell"><i></i><i></i><i></i></div>';}
 function illustration(){if(puzzle==='sumas')return `<div class="big-equation"><div class="equation-item"><div class="asset-stage"><img class="token-img" src="${token}" alt="Token del joc"><span class="asset-value">13</span></div><span class="object-label">El vostre token</span></div><span class="operator">+</span><div class="equation-item"><div class="asset-stage"><img class="terminal-img" src="${terminal}" alt="Terminal del joc"><span class="asset-value terminal-value">5</span></div><span class="object-label">Un terminal</span></div><span class="operator">=</span><div class="equation-item"><div class="asset-stage"><div class="result-ring ${reveal?'solved':''}" aria-label="Resultat ${reveal?'18':'pendent'}">${reveal?'18':'?'}</div></div><span class="object-label">Un objectiu</span></div></div>`;
 if(puzzle==='memory')return `<div class="two-symbols"><div class="token-reference"><div class="small-token"><img src="${token}" alt="Token"><span class="asset-value">13</span></div><span class="object-label">El vostre token</span></div><div class="symbol-field"><span class="symbol-number">01</span><span class="symbol" aria-label="${reveal?'Forma oculta':'Delta blava'}">${reveal?'?':'Δ'}</span><span class="symbol-label">${reveal?'RECORDEU-LA':'FORMA + COLOR'}</span></div><div class="symbol-field"><span class="symbol-number">02</span><span class="symbol" aria-label="${reveal?'Forma oculta':'Omega vermella'}">${reveal?'?':'Ω'}</span><span class="symbol-label">${reveal?'RECORDEU-LA':'FORMA + COLOR'}</span></div></div>`;
 return `<div class="segments-demo"><div class="pattern">${leds()}<span class="object-label">Patró de pantalla</span></div><span class="operator">→</span><div class="terminal-large ${reveal?'lit':''}"><img src="${terminal}" alt="Terminal del joc">${leds()}</div></div>`;}
 function render(){document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===current)));picker.value=puzzle;document.getElementById('puzzle-label').hidden=['welcome','progress','final','game'].includes(current);document.getElementById('progress-controls').hidden=!['progress','success'].includes(current);document.getElementById('progress-input').value=progress;document.getElementById('progress-value').value=progress+'%';stage.dataset.theme=theme;stage.dataset.screen=current;stage.style.setProperty('--ice',themes[theme].cyan);stage.style.setProperty('--violet',themes[theme].pink);stage.style.setProperty('--progress',themes[theme].progress);document.getElementById('game-tools').hidden=current!=='game';document.getElementById('finish').hidden=current==='game';demoButton.hidden=!['brief','ready'].includes(current);stage.dataset.finish=clean?'quiet':'atmosphere';
 if(current==='brief'){const objectives={sumas:'Sumeu el token i el terminal.',memory:'Recordeu dues formes i els seus colors.',segments:'Reproduïu el patró als terminals.'};const rules={sumas:'Cada resultat, una sola vegada.',memory:reveal?'Ara, recordeu-les.':'Mireu-les. Relacioneu-les amb el vostre token.',segments:'Mateixos colors. Mateix ordre.'};stage.innerHTML=`<section class="screen">${header('La següent prova')}<h1 class="title">${titles[puzzle]}</h1><p class="under-title">${objectives[puzzle]}</p>${illustration()}${footer(rules[puzzle])}</section>`;description.textContent='Suport GM · l’exemple ocupa la pantalla · contingut provisional.';demoButton.textContent=reveal?'Repetir exemple':puzzle==='sumas'?'Mostrar resultat':puzzle==='memory'?'Ocultar formes':'Encendre segments';}
 else if(current==='welcome'||current==='final'){const final=current==='final';stage.innerHTML=`<section class="screen">${header(final?'Missió completada':'Organització ADN')}<div class="intro-body">${logo('hero-pyramid')}<div class="intro-copy ${final?'final-copy':''}"><div class="overline">${final?'El repte era de tots':theme==='campanya'?'El repte és de tots.':'Un repte col·lectiu'}</div><h1>${final?'JUNTS,<br>FINS AL CIM.':'LA<br>PIRÀMIDE'}</h1><p>${final?'Cada aportació ha comptat.':'Deu terminals.<br>Un únic equip.'}</p>${final?progressText(100):''}</div></div>${footer(final?'Gràcies per jugar.':'Prepareu-vos als terminals.',final?'':'Escolteu el Game Master')}</section>`;description.textContent=final?'Final · piràmide completa · cada aportació forma part del resultat.':'Benvinguda · emblema vectorial amb llum continguda · 10 terminals, un únic equip.';}
 else if(current==='ready'){stage.innerHTML=`<section class="screen">${header(titles[puzzle])}<div class="centerpiece"><div class="overline">Prepareu-vos</div><div class="countdown" id="countdown">${count}</div><div class="pulse-track">${[3,2,1].map(n=>`<i class="${n>=count?'active':''}"></i>`).join('')}</div></div>${footer('Comencem tots alhora.','')}</section>`;description.textContent='Compte enrere il·lustratiu · només s’activa quan ho decideix el GM.';demoButton.textContent='Reproduir 3 · 2 · 1';}
 else if(current==='success'||current==='progress'){const success=current==='success',amount=shownProgress();stage.innerHTML=`<section class="screen">${header(success?titles[puzzle]:'El vostre recorregut')}<div class="progress-body">${logo('hero-pyramid',amount,success?Math.max(0,progress-10):undefined)}<div class="progress-copy"><div class="overline">${success?'Una fita compartida':'Cada aportació compta'}</div><h1>${success?'PROVA<br>SUPERADA':'CONSTRUÏM<br>EL REPTE'}</h1><p>${success?'Un pas més cap al cim.':'Avancem junts, bloc a bloc.'}</p>${progressText(amount)}</div></div>${footer(success?'Prepareu-vos per al següent repte.':'El següent pas depèn de tots.')}</section>`;description.textContent=success?'Transició · els blocs nous destaquen sobre els assolits · progrés il·lustratiu.':'Progrés de mostra · mou el control per construir la piràmide des de la base.';}

 else{stage.innerHTML=`<iframe class="game-preview" title="Sumes: plantilla actual amb dades de mostra" src="campanya/joc-sumes.html?theme=${theme}#${skin}" sandbox="allow-scripts allow-same-origin"></iframe>`;description.textContent='Plantilla actual de Sumes · mateixa distribució i tipografia · dades de mostra · només canvia l’acabat visual.';}
 size();}
 function size(){const full=!!document.fullscreenElement;const h=full?window.innerHeight:Math.max(180,Math.min(window.innerWidth*9/16,window.innerHeight-document.querySelector('.review').offsetHeight-document.querySelector('.tools').offsetHeight));viewport.style.height=h+'px';const scale=Math.min(viewport.clientWidth/1920,h/1080);stage.style.transform=`translate(-50%,-50%) scale(${scale})`;}
 function stop(){if(countTimer){clearInterval(countTimer);countTimer=null;}}
 function choose(s){stop();current=s;count=3;render();}
 function demo(){if(current==='brief'){reveal=!reveal;render();}else if(current==='ready'){stop();count=3;render();countTimer=setInterval(()=>{count--;if(count<=0){stop();document.getElementById('countdown').textContent='JA!';document.getElementById('countdown').style.fontSize='430px';}else render();},1000);}}
 document.getElementById('theme').addEventListener('change',e=>{theme=e.target.value;render();});
 document.getElementById('progress-input').addEventListener('input',e=>{progress=Number(e.target.value);render();});
 document.getElementById('advance').addEventListener('click',()=>{progress=Math.min(100,progress+10);render();});
 document.querySelectorAll('[data-screen]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.screen)));
 picker.addEventListener('change',()=>{stop();puzzle=picker.value;reveal=false;count=3;render();});demoButton.addEventListener('click',demo);
 document.getElementById('finish').addEventListener('click',e=>{clean=!clean;e.currentTarget.setAttribute('aria-pressed',String(clean));stage.dataset.finish=clean?'quiet':'atmosphere';});
 document.querySelectorAll('[data-skin]').forEach(b=>b.addEventListener('click',()=>{skin=b.dataset.skin;document.querySelectorAll('[data-skin]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.skin===skin)));render();}));
 document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await viewport.requestFullscreen();}catch{description.textContent='Prem F11 per ampliar el navegador.';}});
 document.addEventListener('fullscreenchange',()=>{size();const tip=document.getElementById('fs-tip');clearTimeout(tipTimer);tip.hidden=!document.fullscreenElement;if(document.fullscreenElement)tipTimer=setTimeout(()=>{tip.hidden=true;},2500);});
 window.addEventListener('resize',size);
 document.addEventListener('keydown',e=>{if(['SELECT','INPUT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();choose(order[(order.indexOf(current)+(e.key==='ArrowRight'?1:-1)+order.length)%order.length]);}if(e.code==='Space'){e.preventDefault();demo();}});
 const requested=new URLSearchParams(location.search);if(order.includes(requested.get('screen')))current=requested.get('screen');if(Object.hasOwn(titles,requested.get('puzzle')))puzzle=requested.get('puzzle');reveal=requested.get('example')==='1';if(Object.hasOwn(themes,requested.get('theme')))theme=requested.get('theme');document.getElementById('theme').value=theme;if(requested.has('progress'))progress=Math.max(0,Math.min(100,Number(requested.get('progress'))||0));render();document.fonts.ready.then(size);
})();
</script>
