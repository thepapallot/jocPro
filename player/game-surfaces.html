<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Piràmide · Diseño de los puzzles</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080e14;color:#e8eff1;font-family:Arial,sans-serif}header{display:flex;align-items:center;gap:16px;padding:14px 20px;flex-wrap:wrap;border-bottom:1px solid #38505d}strong{margin-right:auto}select{font:inherit;background:#182b36;color:#e8eff1;border:1px solid #526b78;border-radius:6px;padding:8px 12px}select:focus-visible{outline:3px solid #71e7db;outline-offset:2px}a{color:#71e7db}img{display:block;width:100%;height:calc(100vh - 110px);object-fit:contain}footer{padding:10px 20px;font-size:14px;color:#b0c1cb}</style></head>
<body><header><strong>La Piràmide · Diseño común de los puzzles</strong><select id="state" aria-label="Juego y estado"><option value="memory-tokens">Memory · Memorizar</option><option value="memory-numbers">Memory · Preparación</option><option value="memory-input">Memory · Responder</option><option value="memory-answer">Memory · Respuesta parcial</option><option value="memory-blackOnly">Memory · Formas negras</option><option value="maze-normal">Laberinto · Normal</option><option value="maze-alarm">Laberinto · Alarma</option></select><a href="/test?panel=juego">Control de juego</a></header><img id="preview" alt="Diseño del tablero de Memory"><footer>Capturas del juego con estados simulados. Este visor permite revisar el diseño sin iniciar una partida.</footer>
<script>const state=document.getElementById('state'),preview=document.getElementById('preview');function show(){preview.src='/static/images/previews/game-surfaces/'+state.value+'.png';preview.alt='Diseño del tablero · '+state.selectedOptions[0].textContent;}state.onchange=show;show();</script></body></html>
