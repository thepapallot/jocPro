<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Puzzle{% endblock %}</title>
    <style>
        html, body { background: #02050b; }
    </style>
    <script src="{{ url_for('static', filename='js/shell_guard.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    {% block extra_css %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/game-theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/game-surface.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/level-success.css') }}">
</head>
<body class="pyramid-game">
    <div id="game-stage">
        <div id="game-frame"></div>

        <div id="top-area">
            <div id="top-left" class="top-cell">
                <span class="level-title">
                    {% block level_title %}NIVEL {{ current_level if current_level else 1 }}{% endblock %}
                </span>
            </div>

            <div id="top-center" class="top-cell">

            </div>

            <div id="top-right" class="top-cell">
                {% block top_right %}
                <div id="timer">02:00</div>
                {% endblock %}
            </div>
        </div>

        <div id="bottom-area">
            {% block puzzle_content %}{% endblock %}
        </div>
    </div>

    <script>window.PYRAMID_GAME = {
        puzzleId: {{ puzzle_id|default(0)|tojson }},
        order: {{ game_puzzle_order|tojson }},
        finalId: {{ final_puzzle_id|default(6)|tojson }},
        level: {{ current_level|default(1)|tojson }},
        language: {{ (request.args.get('lang') or game_language)|tojson }},
        nextUrl: {{ (url_for('play_video_puzzles', puzzle_id=next_puzzle_id) if next_puzzle_id|default(None) else url_for('final'))|tojson }}
    };</script>
    <script src="{{ url_for('static', filename='js/game-language.js') }}"></script>
    <script src="{{ url_for('static', filename='js/game-copy.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pyramid-logo.js') }}"></script>
    <script src="{{ url_for('static', filename='js/puzzle-names.js') }}"></script>
    <script src="{{ url_for('static', filename='js/game-theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/presentation-game-bridge.js') }}"></script>
    <script src="{{ url_for('static', filename='js/level-success.js') }}"></script>
    {% block extra_js %}{% endblock %}
    {% block after_body %}{% endblock %}
    <script>
    window.BGM_CONTEXT = window.BGM_CONTEXT || { mode: "medium" };
    </script>
    <script src="{{ url_for('static', filename='js/bgm_layer.js') }}"></script>
    <script>
    (function () {
        const BASE_WIDTH = 1920;
        const BASE_HEIGHT = 1080;
        const stage = document.getElementById("game-stage");

        function updateStageScale() {
            if (!stage) return;
            const scale = Math.min(
                window.innerWidth / BASE_WIDTH,
                window.innerHeight / BASE_HEIGHT
            );

            stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }

        window.addEventListener("resize", updateStageScale, { passive: true });
        updateStageScale();
    })();
    </script>
</body>
</html>
