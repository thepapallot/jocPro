<!doctype html>
<html lang="{{ presentation_page.language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>La Piràmide</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a1016}#game-shell-frame{display:block;border:0;width:100vw;height:100vh}</style>
</head>
<body class="{{ 'presentation-pilot' if request.args.get('embed') == '1' else 'pyramid-shell' }}">
{% if request.args.get('embed') == '1' %}
  {% include '_presentation_screen.html' %}
{% else %}
  <iframe id="game-shell-frame" title="La Piràmide · pantalla dels jugadors" allow="autoplay"></iframe>
  <script>window.PYRAMID_SESSION_LANGUAGE = {{ presentation_page.language|tojson }};</script>
  <script src="{{ url_for('static', filename='js/game-language.js') }}"></script>
  <script src="{{ url_for('static', filename='js/bgm_layer.js') }}"></script>
  <script src="{{ url_for('static', filename='js/game-shell.js') }}"></script>
{% endif %}
</body>
</html>
