{% extends "base.html" %}

{% block title %}Puzzle 2{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/puzzle2.css') }}">
{% endblock %}

{% block top_right %}
{% endblock %}

{% block puzzle_content %}
<div id="puzzle2-container">
    <div id="puzzle2-layout">
        <section id="maze-stage">
            <div id="image-area">
                <div id="p2-snake-stage" aria-live="polite">
                    <div id="p2-hud">
                        <div class="p2-hud-time">
                            <span class="p2-hud-label" data-i18n="game.timeLabel">Tiempo restante</span>
                            <strong id="p2-timer" role="timer" aria-live="off">10:00</strong>
                        </div>
                        <div id="p2-points" class="points-hud" role="status" aria-live="polite" aria-atomic="true">
                            <span class="points-coin" aria-hidden="true">
                                <span class="points-coin-body">
                        <span class="points-coin-edge" style="--coin-depth: -3px"></span>
                        <span class="points-coin-edge" style="--coin-depth: -2px"></span>
                        <span class="points-coin-edge" style="--coin-depth: -1px"></span>
                        <span class="points-coin-edge" style="--coin-depth: 0px"></span>
                        <span class="points-coin-edge" style="--coin-depth: 1px"></span>
                        <span class="points-coin-edge" style="--coin-depth: 2px"></span>
                        <span class="points-coin-edge" style="--coin-depth: 3px"></span>
                                    <img class="points-coin-face points-coin-front" src="{{ url_for('static', filename='images/shared/gameplay/points-medallion.svg') }}" alt="" width="64" height="64">
                                    <img class="points-coin-face points-coin-back" src="{{ url_for('static', filename='images/shared/gameplay/points-medallion.svg') }}" alt="" width="64" height="64">
                                </span>
                            </span>
                            <span class="points-hud-value">
                                <strong id="p2-points-value">100</strong>
                                <span class="points-hud-label" data-i18n="game.memoryPointsAtStake">PUNTOS EN JUEGO</span>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<div id="p2-solved-banner" class="p2-solved-banner hidden">
    <div class="p2-solved-text level-success-title">NIVEL SUPERADO</div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    window.NEXT_PUZZLE_ID = {{ next_puzzle_id|tojson|safe }};
</script>
<script src="{{ url_for('static', filename='js/puzzle2.js') }}"></script>
{% endblock %}
